<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Icons are generated from SFF-Logo-green-white.png (full-bleed green
         square). iOS applies its own rounded mask to apple-touch-icon and
         composites it on black, so that source must stay opaque and squared. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://stayfullyfunded.com/" />

    <title>Stay Fully Funded: Send your email to Coach first</title>
    <meta
      name="description"
      content="Send your supporter update to the Coach before it goes to your list. Built on 20 years of experience, it reviews your draft and sends back a personal report in about 83 seconds. Free to try, no credit card."
    />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stay Fully Funded" />
    <meta property="og:title" content="Stay Fully Funded: Send your email to Coach first" />
    <meta
      property="og:description"
      content="Get a seasoned second look at your supporter update before you hit send. Free to try, no credit card."
    />
    <meta property="og:url" content="https://stayfullyfunded.com/" />
    <meta property="og:image" content="https://stayfullyfunded.com/SFF-OG-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Stay Fully Funded, the Email Coach for ministry supporter updates" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stay Fully Funded: Send your email to Coach first" />
    <meta
      name="twitter:description"
      content="Get a seasoned second look at your supporter update before you hit send. Free to try, no credit card."
    />
    <meta name="twitter:image" content="https://stayfullyfunded.com/SFF-OG-image.png" />
    <meta name="theme-color" content="#059669" />

    <!-- Organization schema: gives Google a machine-readable pointer to the
         brand name and mark (knowledge panel / rich results). The transparent
         logo is deliberate — these surfaces render on white, where the solid
         green square would read as a tile rather than a logo. Add "sameAs"
         with social profile URLs if/when those exist. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Stay Fully Funded",
        "url": "https://stayfullyfunded.com/",
        "logo": "https://stayfullyfunded.com/SFF-Logo-transparent.png",
        "email": "hello@stayfullyfunded.com",
        "description": "An email coach for ministry workers. Send your supporter update to the Coach before it goes to your list and get a personal, point-by-point review back in about 83 seconds."
      }
    </script>

    <!-- Fonts: Outfit (headings) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
