# Cloudflare Workers configuration (replaces the old vercel.json).
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "forever-funded-email-coach"
main = "api/inbound.js"
compatibility_date = "2026-07-01"

# Lets npm packages that expect small pieces of Node.js work in the Worker.
compatibility_flags = ["nodejs_compat"]

# Non-secret configuration. These are safe to keep in this file.
# (Secrets — API keys — are NOT set here; use `wrangler secret put NAME`
# so they're stored encrypted in Cloudflare, never in a file.)
[vars]
ANTHROPIC_MODEL = "claude-sonnet-4-6"
FROM_EMAIL = "coach@review.stayfullyfunded.com"
REVIEW_DOMAIN = "review.stayfullyfunded.com"

# Public anon key (same one Website/.env's VITE_SUPABASE_ANON_KEY uses) — safe
# to commit; it's RLS-gated and meaningless without a valid user access token.
# Used only to build a per-request, user-scoped Supabase client (see
# lib/supabase.js's getUserClient) so RLS enforces "only your own rows" on
# endpoints like /api/report-pdf — never used for privileged access, that's
# what SUPABASE_SERVICE_ROLE_KEY (a real secret, below) is for.
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFibnF1ZG54eXVnemN1eHJ3bnFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5NzgxMTUsImV4cCI6MjA5ODU1NDExNX0.Soe1SjJBNIjHGDNDtyCKLeBWmlXeMpiWPwOelx1QQus"

# Visual rendering soft-rollout gate (v2 path only). Comma-separated list of
# profile emails that get a mobile visual render attached to the Coach call.
# Everyone else stays text-only. Set to "*" to enable for ALL v2 submissions.
# Leave empty to disable rendering entirely. Render failures always fall back
# to text-only regardless of this setting.
RENDER_ALLOWLIST = "*"

# Stripe billing — LIVE MODE IDs (see stripe-billing-build-spec.md Part 1).
# Not secrets: these IDs are visible in every Checkout session, so they're
# committed rather than stored via `wrangler secret put`. STRIPE_SECRET_KEY
# and STRIPE_WEBHOOK_SECRET, the two real secrets, are NOT set here.
#
# These must be paired with a LIVE STRIPE_SECRET_KEY (sk_live_...). Stripe's
# test and live modes are separate universes with separate object IDs — a
# live price ID against a test-mode secret key fails with "No such price."
# Part 10's local testing (wrangler dev + stripe listen) needs the sandbox
# IDs instead; keep those in Webhook/.dev.vars, not here.
STRIPE_PRICE_ANNUAL = "price_1U0K5iDHbOEmKRpLELoig7vj"
# RETIRED: the monthly plan is no longer sold and this price is archived in
# Stripe. Kept only so stripe-webhook.js can still label events arriving on
# pre-existing monthly subscriptions correctly. Nothing creates new
# subscriptions on it. Safe to delete once no monthly subscription exists.
STRIPE_PRICE_MONTHLY = "price_1U0K5jDHbOEmKRpL1bynoG1Y"
STRIPE_COUPON_ANNUAL_DISCOUNT = "eSCNXYsQ"
# STRIPE_COUPON_COURSE_DISCOUNT intentionally unset — see Part 4, direction 2.
# Setting it activates the dormant Coach-subscriber-to-Course discount trigger.

# Cloudflare Browser Rendering (Puppeteer binding) — first-party, no API token.
# Used to render the email HTML to a mobile-width image, then tiled and passed
# to the Coach as image blocks. See lib/render.js.
[browser]
binding = "BROWSER"

# Secrets to set with `wrangler secret put <NAME>` (one command per secret):
#   ANTHROPIC_API_KEY
#   POSTMARK_SERVER_TOKEN
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   SUPABASE_WEBHOOK_SECRET (v2 only — a random string you choose; the
#     Supabase Database Webhook on `profiles` INSERT must send the same
#     value in an `x-webhook-secret` header, or /hooks/new-profile rejects it)
#
# For local testing with `wrangler dev`, put the same four values in a file
# named .dev.vars (see .dev.vars.example) — wrangler reads it automatically
# and it stays on your machine.

# Enables the Logs tab in the Cloudflare dashboard for this Worker, so you
# can see console.error output when debugging (README step 7).
[observability]
enabled = true

# Two cron expressions, ONE scheduled() export in api/inbound.js — Cloudflare
# gives a Worker a single scheduled() handler for all its crons, so it
# branches on event.cron. Never replace this array; always append.
[triggers]
crons = [
  "0 6 */3 * *",  # keep-alive: trivial read-only Supabase query every 3 days,
                  # so the Free-tier project never hits 7 days of inactivity
                  # and gets auto-paused. Never touches quota/review logic.
  "0 13 * * *",   # Stripe billing: daily expiry-reminder sweep, 13:00 UTC.
]
